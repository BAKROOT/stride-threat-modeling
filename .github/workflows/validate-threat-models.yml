name: Validate threat models

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt pytm

      - name: Unit tests for the validator
        run: python -m pytest tools/tests -q

      - name: Validate every threats.yaml and publish coverage
        run: |
          set -o pipefail
          python tools/validate_threats.py $(git ls-files '*threats.yaml') --coverage | tee coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"

      - name: Check CSV export is up to date
        run: |
          python tools/yaml_to_csv.py examples/orbitpay/threats.yaml > /tmp/register.csv
          diff -u examples/orbitpay/threat-register.csv /tmp/register.csv

      - name: Threat model as code (pytm) runs
        working-directory: examples/orbitpay
        run: python orbitpay_tm.py --report pytm_report_template.md > /dev/null
